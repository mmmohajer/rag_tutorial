services:
  api:
    build: ./api
    volumes:
      - ./api:/usr/src/app
    ports:
      - "8000:8000"
    env_file:
      - ./secrets/api/.env
    depends_on:
      db:
        condition: service_healthy

  db:
    image: pgvector/pgvector:0.8.7-pg18
    env_file:
      - ./secrets/db/.env
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 2s
      timeout: 5s
      retries: 30

  scraper:
    build: ./scraper
    command: ["tail", "-f", "/dev/null"]
    env_file:
      - ./secrets/scraper/.env
    volumes:
      - ./scraper:/usr/src/app

volumes:
  pgdata:
